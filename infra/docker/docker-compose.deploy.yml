# Self-contained production stack (standalone — NOT an overlay on docker-compose.yml, whose dev
# defaults like postgres/postgres and minioadmin are rejected by the API's production config check).
#
#   cp .env.production.example .env.production      # fill in every value
#   docker compose --env-file .env.production -f infra/docker/docker-compose.deploy.yml up -d --build
#
# Only Caddy publishes ports (80/443). Everything else lives on the internal network.
name: rag

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@pgbouncer:5432/rag_platform
  DATABASE_POOLER_MODE: transaction
  DATABASE_READ_URL: ${DATABASE_READ_URL:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-25}
  DATABASE_CONNECT_TIMEOUT_S: ${DATABASE_CONNECT_TIMEOUT_S:-5}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
  HNSW_EF_SEARCH: ${HNSW_EF_SEARCH:-64}
  HNSW_ITERATIVE_SCAN: ${HNSW_ITERATIVE_SCAN:-relaxed_order}
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-documents}
  LLM_PROVIDER: ${LLM_PROVIDER:-cloudflare}
  LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-@cf/meta/llama-3.1-8b-instruct}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-cloudflare}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-@cf/baai/bge-m3}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-auto}
  CLOUDFLARE_RERANKER_MODEL: ${CLOUDFLARE_RERANKER_MODEL:-@cf/baai/bge-reranker-base}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  RERANKER_MODEL: ${RERANKER_MODEL:-rerank-v3.5}
  MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
  OCR_SERVICE_URL: http://ocr:8000
  ENABLE_VIRUS_SCAN: ${ENABLE_VIRUS_SCAN:-true}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    shm_size: 1g
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../deploy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d rag_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transaction-mode connection multiplexer for API & Worker replicas.
  # Migrations and Keycloak stay directly on `postgres:5432` (session-level locks/DDL).
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: rag_platform
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-30}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data

  keycloak:
    build:
      context: ../keycloak
    image: rag-keycloak:26.0
    restart: unless-stopped
    command: start
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HTTP_ENABLED: "true"        # TLS is terminated by Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1g

  ocr:
    build:
      context: ../ocr
    restart: unless-stopped
    volumes:
      - ocr_models:/root/.paddleocr
    deploy:
      resources:
        limits:
          memory: 2g

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2g

  # One-shot: applies pending SQL migrations, then exits. api/worker wait for it to succeed.
  migrate:
    image: ${IMAGE_PREFIX:-arkhiverag}-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/api/Dockerfile
    command: ["node", "node_modules/@rag/database/dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/rag_platform
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-arkhiverag}-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3002"
      HOST: 0.0.0.0
      METRICS_PORT: "9100"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "true"
      CORS_ORIGINS: https://${APP_DOMAIN}
      KEYCLOAK_URL: https://${AUTH_DOMAIN}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-rag-platform}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-20}
      GUEST_CHAT_ENABLED: ${GUEST_CHAT_ENABLED:-true}
      GUEST_CHAT_PER_IP_PER_MINUTE: ${GUEST_CHAT_PER_IP_PER_MINUTE:-6}
      GUEST_CHAT_PER_IP_PER_DAY: ${GUEST_CHAT_PER_IP_PER_DAY:-40}
      GUEST_CHAT_GLOBAL_PER_DAY: ${GUEST_CHAT_GLOBAL_PER_DAY:-1000}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-30}
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ${IMAGE_PREFIX:-arkhiverag}-worker:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9092}
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ocr:
        condition: service_started
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9092/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${IMAGE_PREFIX:-arkhiverag}-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
    restart: unless-stopped
    environment:
      AUTH_URL: https://${APP_DOMAIN}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-rag-web}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET}
      AUTH_KEYCLOAK_ISSUER: https://${AUTH_DOMAIN}/realms/${KEYCLOAK_REALM:-rag-platform}
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - keycloak

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  # Not public: reach it with  ssh -L 3003:127.0.0.1:3003 <server>  then http://localhost:3003
  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  ocr_models:
  caddy_data:
  caddy_config:
