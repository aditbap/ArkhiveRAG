services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: rag-postgres
    restart: always
    shm_size: 1g
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../deploy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opt-in PgBouncer transaction pooler for local concurrency testing:
  #   docker compose -f infra/docker/docker-compose.yml --profile pooler up -d pgbouncer
  # Connect via DATABASE_URL=postgresql://postgres:postgres@localhost:6432/rag_platform
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: rag-pgbouncer
    profiles: ["pooler"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: rag_platform
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "30"
      RESERVE_POOL_SIZE: "10"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Upstream minio/minio images are no longer published on Docker Hub/Quay.
    image: cgr.dev/chainguard/minio:latest
    container_name: rag-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "minio", "--version"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ../keycloak
    image: rag-keycloak:26.0
    container_name: rag-keycloak
    restart: always
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080" # 8080 is taken by another project's container on this machine
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # Keycloak 26 moved /health off the main port onto the management port
      # (9000), which isn't published here — this probe just checks the main
      # port accepts connections at all.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  ocr:
    build:
      context: ../ocr
    container_name: rag-ocr
    restart: always
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s # first boot downloads PaddleOCR's detection/recognition models

  clamav:
    image: clamav/clamav:stable
    container_name: rag-clamav
    restart: always
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s # first boot downloads virus definitions — this is slow

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rag-prometheus
    restart: always
    extra_hosts:
      # host.docker.internal resolves out of the box on Docker Desktop
      # (macOS/Windows); this makes it also resolve on Linux (e.g. the ML310e
      # deployment target), where it's otherwise not defined.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rag-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3003:3000" # 3000 is taken by apps/web and 3002 by apps/api
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  keycloak_data:
  clamav_data:
  prometheus_data:
  grafana_data:
