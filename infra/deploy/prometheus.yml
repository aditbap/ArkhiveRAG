global:
  scrape_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'rag-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:9100']   # METRICS_PORT; internal network only

  - job_name: 'rag-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9092'] # WORKER_METRICS_PORT; internal network only
