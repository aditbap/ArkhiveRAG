# ==============================================================================
# ArkhiveRAG V2.7 — Tuned PostgreSQL 15 + pgvector Configuration
# ==============================================================================
# Designed for SSD/NVMe hosts with >= 2 GB RAM allocated to Postgres.
# For dedicated database hosts with >= 8 GB RAM, raise `shared_buffers` to 25%
# of host RAM and `effective_cache_size` to 75% of host RAM.

listen_addresses = '*'
max_connections = 200

# ---- Memory & HNSW / GIN Buffer Cache ----
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 32MB
maintenance_work_mem = 512MB

# ---- SSD / NVMe Planner Calibration ----
# Stock random_page_cost=4.0 biases the planner toward Seq Scan over HNSW/GIN.
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
default_statistics_target = 200

# ---- WAL & Checkpoint Smoothing ----
wal_buffers = 16MB
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 2GB

# ---- Parallelism & Autovacuum ----
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ---- Query Telemetry ----
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
